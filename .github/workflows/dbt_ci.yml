name: dbt CI

# Corre en un runner de GitHub Actions (gratis para repos públicos) contra
# DuckDB — sin credenciales, sin warehouse que levantar. `dbt seed` va en un
# paso aparte de `dbt run`/`dbt test`: dbt no infiere que un seed llena la
# tabla que un modelo referencia vía source(), así que en una base nueva
# (como la de cada corrida de CI) hay que cargar los seeds primero.

on:
  pull_request:
    paths:
      - 'warehouse/**'
      - '.github/workflows/dbt_ci.yml'
  push:
    branches: [main]
    paths:
      - 'warehouse/**'
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse
    env:
      DBT_PROFILES_DIR: profiles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: warehouse/requirements.txt

      - name: Instalar dbt-duckdb
        run: pip install -r requirements.txt

      - name: Regenerar los seeds sintéticos (reproducible, semilla fija)
        run: python3 seeds/generators/generate_bronze.py

      - name: dbt deps
        run: dbt deps

      - name: dbt seed
        run: dbt seed --target ci

      - name: Verificar migración 1:1 de bronze (DDL legacy vs seeds)
        run: python3 scripts/verify_bronze_migration.py ci_xia_warehouse.duckdb

      - name: dbt run
        run: dbt run --target ci

      - name: dbt test
        run: dbt test --target ci
