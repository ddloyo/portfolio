version: 2
models:
- name: rpt_marketing_canales
  description: Gasto, clientes nuevos, ticket, retención y margen por canal x mes (meses completos). Base del dashboard 09. Contrato = columnas y tipos de projects/09-roi-marketing-canal/data/marketing_canales.csv.
  config:
    contract:
      enforced: true
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - canal
        - mes
  columns:
  - name: canal
    data_type: varchar
  - name: mes
    data_type: varchar
  - name: gasto_mxn
    data_type: double
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: clientes_nuevos
    data_type: bigint
  - name: ticket_promedio_mxn
    data_type: double
  - name: meses_retencion_prom
    data_type: double
  - name: margen_bruto
    data_type: double
