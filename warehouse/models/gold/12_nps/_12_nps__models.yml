version: 2
models:
- name: rpt_encuestas_nps
  description: Una fila por respuesta NPS (meses completos). Base del dashboard 12. Contrato = columnas y tipos de projects/12-nps-causa-raiz/data/encuestas_nps.csv.
  config:
    contract:
      enforced: true
  columns:
  - name: respuesta_id
    data_type: varchar
    data_tests:
    - unique
    - not_null
  - name: mes
    data_type: varchar
  - name: score
    data_type: bigint
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 10
  - name: categoria
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Promotor
          - Pasivo
          - Detractor
  - name: motivo_detractor
    data_type: varchar
