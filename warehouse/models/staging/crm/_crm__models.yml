version: 2
models:
- name: stg_crm__cliente
  description: Cliente limpio y tipado. Aún puede traer cliente_id duplicado — dim_cliente lo resuelve.
  columns:
  - name: cliente_id
    description: Identificador de cliente en el CRM.
    data_tests:
    - not_null:
        config:
          severity: warn
- name: stg_crm__equipo
  description: Equipos comerciales.
  columns:
  - name: equipo_id
    data_tests:
    - unique
    - not_null
- name: stg_crm__vendedor
  description: Vendedores y el equipo al que pertenecen.
  columns:
  - name: vendedor_id
    data_tests:
    - unique
    - not_null
- name: stg_crm__meta_venta
  description: Meta mensual vigente por equipo, tipada.
  columns:
  - name: equipo_id
    data_tests:
    - not_null
- name: stg_crm__oportunidad_evento
  description: Eventos del pipeline comercial, tipados.
  columns:
  - name: evento_id
    data_tests:
    - not_null
- name: stg_crm__cancelacion
  description: Bajas de contrato/plan, tipadas.
  columns:
  - name: cliente_id
    data_tests:
    - not_null
