version: 2

sources:
  - name: cliente
    schema: raw
    description: >
      Features de churn por cliente, reutilizado tal cual de
      `projects/04-prediccion-churn/data/clientes.csv`. Es un universo de
      clientes SINTÉTICO INDEPENDIENTE del CRM de crm.clientes — no se
      fuerza un join entre ambos porque no son la misma población.
    tables:
      - name: clientes_churn
        description: 1 fila por cliente, snapshot de features de churn.
        columns:
          - name: cliente_id
          - name: churn_historico
            description: "1 si el cliente ya canceló, 0 si sigue activo — la variable objetivo, no una predicción."
