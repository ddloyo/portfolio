version: 2

models:
  - name: stg_cliente__churn_features
    description: Features de churn por cliente, tipadas.
    columns:
      - name: cliente_id
        data_tests:
          - unique
          - not_null
      - name: tipo_contrato
        data_tests:
          - accepted_values:
              arguments:
                values: ['Mensual', 'Anual']
      - name: plan
        data_tests:
          - accepted_values:
              arguments:
                values: ['Starter', 'Pro', 'Business']
