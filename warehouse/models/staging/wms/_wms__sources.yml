version: 2

sources:
  - name: wms
    schema: raw
    # Frescura: Snapshot de inventario nocturno.
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 48, period: hour}
    description: >
      Sistema de almacén. Migración 1:1 de `bronze.inventario_snapshot`
      (`_source_system` original: `wms`). Aún sin modelos de staging.
    tables:
      - name: inventario_snapshot
        description: >
          Foto semanal de inventario por SKU (4 fotos). El segmento de
          demanda (alta/media/baja) NO viene de aquí — se calcula a partir
          del historial de ventas.
        meta: {legacy_table: bronze.inventario_snapshot}
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [sku, fecha_snapshot]
        columns:
          - name: sku
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('erp', 'producto')
                    field: sku
