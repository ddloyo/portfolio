name: 'xia_warehouse'
version: '1.0.0'
config-version: 2

profile: 'xia_warehouse'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Fecha "de referencia" para los modelos que calculan antigüedad/recencia
  # contra hoy — fija para que las corridas sean reproducibles en CI.
  fecha_referencia: '2026-09-18'

seeds:
  # Todo seed aterriza como TEXT (ver macros/duckdb__create_csv_table.sql):
  # bronze no interpreta nada, tipar es trabajo de staging.
  xia_warehouse:
    +schema: raw

models:
  xia_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
